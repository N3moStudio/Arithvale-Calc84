name: Inspect simulator diagnostics
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Build run containing the simulator result
        required: true
        type: string
permissions:
  actions: read
  contents: read
jobs:
  inspect:
    runs-on: macos-26
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
          pattern: Arithen-Simulator-*
          merge-multiple: true
          path: evidence
      - name: Export native crash and console diagnostics
        run: |
          xcrun xcresulttool export diagnostics --path evidence/Journeys.xcresult --output-path diagnostics
          xcrun xcresulttool get test-results tests --path evidence/Journeys.xcresult > diagnostics/tests.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Arithen-Diagnostics-${{ inputs.run_id }}
          path: diagnostics/
          include-hidden-files: true
          if-no-files-found: error
